name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # The action defaults to Node 20; Astro 7 requires >=22.12.0 and
          # exits rather than warning. Keep this in step with the "engines"
          # field in package.json.
          node-version: 22
        # Runs install + build and uploads dist/ as the Pages artifact.
        # The build script also runs scripts/check-translations.mjs, so a
        # missing translation or a broken cross-link fails the deploy.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Chromium: the suite asserts behaviour, not rendering engines.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and serves the site itself, so this runs
      # against exactly what would be published.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # A red suite must not reach Pages — the build gate checks content, these
    # check that the thing still works.
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
